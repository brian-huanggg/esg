services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: applies SQL migrations, then exits. backend waits for it below.
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile.migrate
    command:
      - "-database"
      - "mysql://${DB_USER}:${DB_PASSWORD}@tcp(db:3306)/${DB_NAME}"
      - "up"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ../backend
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    # No published port: only the frontend container (Nginx) reaches it, keeping same-origin.
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - backend

volumes:
  db-data: