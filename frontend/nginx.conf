server {
    listen 8080;
    root /usr/share/nginx/html;

    # Same-origin: the browser only talks to Nginx, so the backend needs no CORS.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed filenames, so these files can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: unknown paths (e.g. /login on refresh) go to the React router.
    # index.html must not be cached, or users keep loading stale hashed asset names.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
