name: Docs

on:
  push:
    branches:
      - main
    paths:
      - notes/**
      - .github/workflow/docs.yaml
  # Allows a manual re-deploy
  workflow_dispatch:

# Pages deploys use OIDC (id-token) and need write access to the Pages API.
permissions:
  contents: read
  pages: write
  id-token: write

# Keep one deploy at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: notes/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
        working-directory: notes
      - name: Build site
        run: npm run build
        working-directory: notes
      - uses: actions/upload-pages-artifact@v4
        with:
          path: notes/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
