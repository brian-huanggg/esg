openapi: 3.0.3
info:
  title: ESG Proposal Contest API
  version: 0.1.0
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/accounts:
    post:
      operationId: createAccount
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "409":
          description: Employee id already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

      deprecated: false
  /api/sessions:
    post:
      operationId: createSession
      summary: Log in (create a session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: >
            Logged in. Sets two cookies: `session` (HttpOnly) and
            `csrf_token` (readable by JS, echoed back as X-CSRF-Token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          description: Wrong employee id or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sessions/current:
    delete:
      operationId: deleteCurrentSession
      summary: Log out (delete the current session)
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              required: true
              description: Expires the `session` and `csrf_token` cookies (Max-Age=0).
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/accounts/me:
    get:
      operationId: getCurrentAccount
      summary: Get the logged-in account
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/proposals:
    post:
      operationId: createProposal
      summary: Create a proposal led by the logged-in account
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProposalRequest"
      responses:
        "201":
          description: Proposal created
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              required: true
              description: URL of the new proposal, e.g. /api/proposals/{id}.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: This leader already has a proposal with the same title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/proposals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProposal
      summary: Get one proposal
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The proposal
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  headers:
    ETag:
      required: true
      description: >
        Strong validator built from the proposal version, e.g. "3" (with quotes).
        Send it back as If-Match on writes.
      schema:
        type: string
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  responses:
    Unauthorized:
      description: Not logged in, or the session expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: CSRF token missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >
        Does not exist, or the caller may not see it. Both return 404
        so the response does not reveal which ids exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    CreateAccountRequest:
      type: object
      required:
        - employeeId
        - name
        - password
      properties:
        employeeId:
          type: string
          pattern: "^[0-9]{6}$"
        name:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 72
    CreateSessionRequest:
      type: object
      required:
        - employeeId
        - password
      properties:
        employeeId:
          type: string
        password:
          type: string
          maxLength: 72
    Account:
      type: object
      required:
        - id
        - employeeId
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateProposalRequest:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
    Proposal:
      type: object
      required:
        - id
        - title
        - description
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
    Error:
      type: object
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"